name: Deploy DrawCover

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drawcover-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check deployment secrets
        id: credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        shell: bash
        run: |
          if [[ -z "$CF_TOKEN" || -z "$CF_ACCOUNT" || -z "$AI_KEY" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment skipped. Add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and OPENROUTER_API_KEY repository secrets, then rerun this workflow."
            echo "Deployment skipped: required Cloudflare/OpenRouter repository secrets are missing." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: steps.credentials.outputs.ready == 'true'
      - uses: actions/setup-node@v6
        if: steps.credentials.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install and verify
        if: steps.credentials.outputs.ready == 'true'
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npx playwright install --with-deps chromium
          npm run test:e2e
          npm run cf:build
          npm run test:workers
      - name: Deploy, preserving an existing Worker secret
        if: steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          secret_file="$RUNNER_TEMP/cloudflare-secrets.json"
          trap 'rm -f "$secret_file"' EXIT
          SECRET_NAMES="$RUNNER_TEMP/worker-secret-names.json" node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const { name } = JSON.parse(readFileSync("wrangler.jsonc", "utf8"));
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${name}/secrets`, {
              headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` }
            });
            if (!response.ok && response.status !== 404) throw new Error(`Cannot inspect Worker secret names: HTTP ${response.status}`);
            const body = response.status === 404 ? { result: [] } : await response.json();
            if (!Array.isArray(body.result)) throw new Error("Invalid Worker secret-name response");
            writeFileSync(process.env.SECRET_NAMES, JSON.stringify(body.result), { mode: 0o600 });
          '
          if SECRET_NAMES="$RUNNER_TEMP/worker-secret-names.json" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const names = JSON.parse(readFileSync(process.env.SECRET_NAMES, "utf8"));
            process.exit(names.some(secret => secret.name === "OPENROUTER_API_KEY") ? 0 : 1);
          '; then
            echo "Preserving the existing server-side OPENROUTER_API_KEY."
            npm run cf:deploy
          else
            SECRET_FILE="$secret_file" node --input-type=module -e '
              import { writeFileSync } from "node:fs";
              writeFileSync(process.env.SECRET_FILE, JSON.stringify({
                OPENROUTER_API_KEY: process.env.OPENROUTER_API_KEY
              }), { mode: 0o600 });
            '
            npm run cf:deploy -- --secrets-file "$secret_file"
          fi
      - name: Verify the public app without generating content
        if: steps.credentials.outputs.ready == 'true'
        run: |
          curl --fail --retry 5 --retry-delay 10 --retry-all-errors --silent --output /dev/null https://drawcover.oeng.dev
          curl --fail --retry 5 --retry-delay 10 --retry-all-errors --silent https://drawcover.oeng.dev/api/drawcover/status
          echo "DrawCover deployed: https://drawcover.oeng.dev" >> "$GITHUB_STEP_SUMMARY"
